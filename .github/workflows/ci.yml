# Tests bei jedem Pull-Request und bei jedem Push auf main.
# Ein Pull-Request darf nur gemergt werden, wenn dieser Workflow grün ist (Branch-Schutz, siehe TODO.md).
name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: npm
      - name: npm aktualisieren
        run: npm install -g npm@12
      - name: Abhängigkeiten installieren
        run: npm ci
      - name: Sicherheitsprüfung der Abhängigkeiten
        run: npm audit --audit-level=moderate
      - name: Lint und Formatierung
        run: npm run lint
      - name: Unit-Tests
        run: npm run test:unit
      - name: Build (Hauptseite und Vorschau-Variante)
        run: npm run build:e2e
      - name: Playwright-Browser installieren
        run: npx playwright install --with-deps chromium
      - name: Browser-Tests
        run: npm run test:e2e
      - name: Testbericht hochladen
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
