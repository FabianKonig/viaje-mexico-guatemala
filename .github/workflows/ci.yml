# Tests bei jedem Pull-Request (und als Teil des Deployments, siehe deploy.yml).
# Ein Pull-Request darf nur gemergt werden, wenn dieser Workflow grün ist (Branch-Schutz, siehe TODO.md).
name: Tests

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: npm
      - name: npm aktualisieren
        run: npm install -g npm@12
      - name: Abhängigkeiten installieren
        run: npm ci
      - name: Sicherheitsprüfung der Abhängigkeiten
        run: npm audit --audit-level=moderate
      - name: Lint, Formatierung, .gitignore, Lizenzen
        run: npm run lint
      - name: Unit-Tests
        run: npm run test:unit
      - name: Build (Hauptseite und Vorschau-Variante, inkl. Bild- und Build-Prüfungen)
        run: npm run build:e2e
      - name: Playwright-Browser installieren
        run: npx playwright install --with-deps chromium
      - name: Browser-Tests
        run: npm run test:e2e
      - name: Screenshots hochladen (Handy und Computer)
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots
          path: test-results/screens/
          retention-days: 14
          if-no-files-found: ignore
      - name: Testbericht hochladen
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      - name: Gebaute Seite des Pull-Requests als Artefakt (Vorschau, ohne Service Worker)
        if: github.event_name == 'pull_request'
        run: PREVIEW=true OUT_DIR=dist-artifact npm run build
      - name: Artefakt hochladen
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: website-vorschau
          path: dist-artifact/
          retention-days: 14
